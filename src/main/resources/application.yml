server:
  port: 8080
  servlet:
    session:
      timeout: 30m

spring:
  application:
    name: UTECommerce
  config:
    import: optional:file:./application-secret.yml
  
  # Database configuration (MySQL)
  datasource:
    url: jdbc:mysql://localhost:3306/utecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: true

  # Thymeleaf Template Engine
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML

  # Multipart / Upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# Cloudinary Storage Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
  api-key: ${CLOUDINARY_API_KEY:your_api_key}
  api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}

