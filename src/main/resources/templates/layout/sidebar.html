<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<!-- Reusable Sidebar Fragment -->
<aside th:fragment="sidebar" class="bg-white p-3 rounded-3 shadow-sm border">
    <!-- Category Filter -->
    <div class="mb-4">
        <h6 class="fw-bold text-uppercase text-secondary mb-3 small d-flex align-items-center">
            <i class="bi bi-grid-fill me-2 text-primary"></i>Danh mục thời trang
        </h6>
        <div class="list-group list-group-flush small">
            <a th:href="@{/products}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center px-0 border-0 fw-medium"
               th:classappend="${selectedCategoryId == null && keyword == null} ? 'text-primary fw-bold' : 'text-dark'">
                <span><i class="bi bi-chevron-right me-1 text-muted small"></i>Tất cả sản phẩm</span>
                <span class="badge bg-light text-secondary rounded-pill">120+</span>
            </a>
            <a th:href="@{/products(categoryId=1)}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center px-0 border-0"
               th:classappend="${selectedCategoryId == 1} ? 'text-primary fw-bold' : 'text-dark'">
                <span><i class="bi bi-chevron-right me-1 text-muted small"></i>Áo thun & Polo</span>
                <span class="badge bg-light text-secondary rounded-pill">45</span>
            </a>
            <a th:href="@{/products(categoryId=2)}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center px-0 border-0"
               th:classappend="${selectedCategoryId == 2} ? 'text-primary fw-bold' : 'text-dark'">
                <span><i class="bi bi-chevron-right me-1 text-muted small"></i>Áo sơ mi</span>
                <span class="badge bg-light text-secondary rounded-pill">30</span>
            </a>
            <a th:href="@{/products(categoryId=3)}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center px-0 border-0"
               th:classappend="${selectedCategoryId == 3} ? 'text-primary fw-bold' : 'text-dark'">
                <span><i class="bi bi-chevron-right me-1 text-muted small"></i>Quần jeans & Kaki</span>
                <span class="badge bg-light text-secondary rounded-pill">28</span>
            </a>
            <a th:href="@{/products(categoryId=4)}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center px-0 border-0"
               th:classappend="${selectedCategoryId == 4} ? 'text-primary fw-bold' : 'text-dark'">
                <span><i class="bi bi-chevron-right me-1 text-muted small"></i>Váy & Đầm nữ</span>
                <span class="badge bg-light text-secondary rounded-pill">35</span>
            </a>
            <a th:href="@{/products(categoryId=5)}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center px-0 border-0"
               th:classappend="${selectedCategoryId == 5} ? 'text-primary fw-bold' : 'text-dark'">
                <span><i class="bi bi-chevron-right me-1 text-muted small"></i>Áo khoác & Hoodie</span>
                <span class="badge bg-light text-secondary rounded-pill">20</span>
            </a>
            <a th:href="@{/products(categoryId=6)}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center px-0 border-0"
               th:classappend="${selectedCategoryId == 6} ? 'text-primary fw-bold' : 'text-dark'">
                <span><i class="bi bi-chevron-right me-1 text-muted small"></i>Giày & Sneaker</span>
                <span class="badge bg-light text-secondary rounded-pill">18</span>
            </a>
            <a th:href="@{/products(categoryId=7)}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center px-0 border-0"
               th:classappend="${selectedCategoryId == 7} ? 'text-primary fw-bold' : 'text-dark'">
                <span><i class="bi bi-chevron-right me-1 text-muted small"></i>Phụ kiện (Nón, Thắt lưng)</span>
                <span class="badge bg-light text-secondary rounded-pill">15</span>
            </a>
        </div>
    </div>

    <hr class="text-muted my-3">

    <!-- Price Filter -->
    <div class="mb-4">
        <h6 class="fw-bold text-uppercase text-secondary mb-3 small d-flex align-items-center">
            <i class="bi bi-cash-stack me-2 text-success"></i>Mức giá
        </h6>
        <div class="form-check mb-2 small">
            <input class="form-check-input" type="checkbox" id="priceAll" checked>
            <label class="form-check-label" for="priceAll">Tất cả mức giá</label>
        </div>
        <div class="form-check mb-2 small">
            <input class="form-check-input" type="checkbox" id="price1">
            <label class="form-check-label" for="price1">Dưới 200.000đ</label>
        </div>
        <div class="form-check mb-2 small">
            <input class="form-check-input" type="checkbox" id="price2">
            <label class="form-check-label" for="price2">200.000đ - 500.000đ</label>
        </div>
        <div class="form-check mb-2 small">
            <input class="form-check-input" type="checkbox" id="price3">
            <label class="form-check-label" for="price3">500.000đ - 1.000.000đ</label>
        </div>
        <div class="form-check mb-2 small">
            <input class="form-check-input" type="checkbox" id="price4">
            <label class="form-check-label" for="price4">Trên 1.000.000đ</label>
        </div>
    </div>

    <hr class="text-muted my-3">

    <!-- Size Filter -->
    <div class="mb-4">
        <h6 class="fw-bold text-uppercase text-secondary mb-3 small d-flex align-items-center">
            <i class="bi bi-rulers me-2 text-warning"></i>Kích thước (Size)
        </h6>
        <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm px-3 py-1">S</button>
            <button type="button" class="btn btn-outline-secondary btn-sm px-3 py-1 active">M</button>
            <button type="button" class="btn btn-outline-secondary btn-sm px-3 py-1">L</button>
            <button type="button" class="btn btn-outline-secondary btn-sm px-3 py-1">XL</button>
            <button type="button" class="btn btn-outline-secondary btn-sm px-3 py-1">XXL</button>
        </div>
    </div>

    <hr class="text-muted my-3">

    <!-- Promo Banner Mini -->
    <div class="card bg-primary text-white border-0 p-3 text-center rounded-3">
        <i class="bi bi-gift fs-2 mb-2 text-warning"></i>
        <h6 class="fw-bold mb-1">Mã Giảm 20%</h6>
        <p class="small text-white-50 mb-2">Dành riêng cho tân sinh viên HCMUTE</p>
        <div class="bg-white text-primary fw-bold py-1 px-2 rounded small">UTE2026</div>
    </div>

    <!-- Hotline Help -->
    <div class="mt-4 pt-2 text-center text-muted small">
        <p class="mb-1"><i class="bi bi-headset me-1 text-danger"></i>Hotline hỗ trợ:</p>
        <span class="fw-bold text-dark">028.3896.8641</span>
    </div>
</aside>
</body>
</html>
