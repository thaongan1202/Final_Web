<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
    <div class="container">
        <!-- Logo -->
        <a class="navbar-brand fw-bold fs-4" th:href="@{/}">
            <i class="bi bi-bag-check-fill me-2"></i>UTECommerce
        </a>

        <!-- Mobile toggler -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <!-- Search bar -->
            <form class="d-flex mx-auto my-2 my-lg-0 col-12 col-lg-5" th:action="@{/products}" method="get">
                <div class="input-group">
                    <input class="form-control" type="search" name="keyword" placeholder="Tìm kiếm sản phẩm, danh mục..." aria-label="Search">
                    <button class="btn btn-warning text-dark fw-semibold" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </form>

            <!-- Navigation Links -->
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                <li class="nav-item">
                    <a class="nav-link text-white fw-medium" th:href="@{/}">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white fw-medium" th:href="@{/products}">Sản phẩm</a>
                </li>

                <!-- Giỏ hàng -->
                <li class="nav-item me-2">
                    <a class="nav-link text-white position-relative" th:href="@{/cart}">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartBadge">
                            0
                        </span>
                    </a>
                </li>

                <!-- Khi chưa đăng nhập -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="btn btn-outline-light btn-sm me-2" th:href="@{/login}">Đăng nhập</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="btn btn-warning btn-sm text-dark fw-semibold" th:href="@{/register}">Đăng ký</a>
                </li>

                <!-- Khi đã đăng nhập -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle text-white d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle fs-5 me-1"></i>
                        <span sec:authentication="name">Tài khoản</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li sec:authorize="hasRole('ADMIN')">
                            <a class="dropdown-item text-danger fw-semibold" th:href="@{/admin/dashboard}">
                                <i class="bi bi-speedometer2 me-2"></i>Trang Quản trị
                            </a>
                        </li>
                        <li sec:authorize="hasRole('ADMIN')"><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Hồ sơ cá nhân</a></li>
                        <li><a class="dropdown-item" th:href="@{/orders}"><i class="bi bi-box-seam me-2"></i>Đơn mua của tôi</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
