<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::#main-content})}">
<head>
    <title th:text="${product.name} + ' - UTECommerce'">Chi tiết sản phẩm</title>
</head>
<body>
<div id="main-content" class="container py-4">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Trang chủ</a></li>
            <li class="breadcrumb-item"><a th:href="@{/products}" class="text-decoration-none">Sản phẩm</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${product.name}"></li>
        </ol>
    </nav>

    <div class="row g-4 bg-white p-4 rounded-3 shadow-sm border">
        <!-- Product Image Gallery -->
        <div class="col-md-5">
            <div class="position-relative">
                <img th:src="${product.primaryImageUrl != null ? product.primaryImageUrl : 'https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=600'}"
                     class="img-fluid rounded-3 border w-100" style="max-height: 450px; object-fit: cover;" th:alt="${product.name}">
            </div>
        </div>

        <!-- Product Details -->
        <div class="col-md-7">
            <span class="badge bg-primary mb-2" th:text="${product.categoryName} ?: 'Thời trang'"></span>
            <h2 class="fw-bold mb-2" th:text="${product.name}"></h2>

            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="text-warning small">
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-half"></i>
                    <span class="text-muted ms-1">(4.9/5 dựa trên 32 đánh giá)</span>
                </div>
                <span class="text-muted small">|</span>
                <span class="text-success small fw-semibold"><i class="bi bi-check-circle me-1"></i>Còn hàng</span>
            </div>

            <div class="p-3 bg-light rounded-3 mb-4">
                <div class="d-flex align-items-baseline gap-3">
                    <span class="text-danger fw-bold fs-3"
                          th:text="${#numbers.formatDecimal(product.basePrice, 0, 'POINT', 0, 'POINT')} + ' đ'"></span>
                    <span class="text-muted text-decoration-line-through fs-5"
                          th:if="${product.originalPrice != null}"
                          th:text="${#numbers.formatDecimal(product.originalPrice, 0, 'POINT', 0, 'POINT')} + ' đ'"></span>
                </div>
            </div>

            <p class="text-secondary mb-4" th:text="${product.shortDescription} ?: 'Sản phẩm thời trang cao cấp phong cách trẻ trung hiện đại, thoáng mát và bền đẹp.'"></p>

            <!-- Size Selection -->
            <div class="mb-3">
                <label class="form-label fw-semibold small">Chọn Kích Thước:</label>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-secondary btn-sm px-3">S</button>
                    <button type="button" class="btn btn-outline-primary btn-sm px-3 active">M</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm px-3">L</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm px-3">XL</button>
                </div>
            </div>

            <!-- Color Selection -->
            <div class="mb-4">
                <label class="form-label fw-semibold small">Chọn Màu Sắc:</label>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-dark btn-sm px-3 active">Đen</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm px-3">Trắng</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm px-3">Xanh Navy</button>
                </div>
            </div>

            <!-- Actions -->
            <form th:action="@{/cart/add}" method="post" class="d-flex gap-3 align-items-center">
                <input type="hidden" name="productId" th:value="${product.id}">
                <div class="input-group" style="width: 130px;">
                    <button class="btn btn-outline-secondary" type="button">-</button>
                    <input type="number" name="quantity" class="form-control text-center" value="1" min="1">
                    <button class="btn btn-outline-secondary" type="button">+</button>
                </div>
                <button type="submit" class="btn btn-primary fw-semibold px-4 py-2">
                    <i class="bi bi-cart-plus me-2"></i>Thêm vào giỏ hàng
                </button>
                <button type="button" class="btn btn-outline-danger px-3 py-2" title="Yêu thích">
                    <i class="bi bi-heart"></i>
                </button>
            </form>

            <hr class="my-4">

            <div class="row g-2 text-muted small">
                <div class="col-sm-6"><i class="bi bi-shield-check me-2 text-success"></i>Bảo hành đổi trả trong 7 ngày</div>
                <div class="col-sm-6"><i class="bi bi-truck me-2 text-primary"></i>Miễn phí vận chuyển cho sinh viên UTE</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
