<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::#main-content})}">
<head>
    <title>Giỏ hàng - UTECommerce</title>
</head>
<body>
<div id="main-content" class="container py-4">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Trang chủ</a></li>
            <li class="breadcrumb-item active" aria-current="page">Giỏ hàng của bạn</li>
        </ol>
    </nav>

    <h3 class="fw-bold mb-4"><i class="bi bi-cart3 me-2 text-primary"></i>Giỏ Hàng Của Bạn</h3>

    <div class="row g-4">
        <!-- Cart Items Table -->
        <div class="col-lg-8">
            <div class="bg-white p-4 rounded-3 shadow-sm border">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Sản phẩm</th>
                                <th>Đơn giá</th>
                                <th>Số lượng</th>
                                <th>Tạm tính</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Sample Cart Row -->
                            <tr>
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=100" class="rounded" style="width: 60px; height: 60px; object-fit: cover;" alt="Áo thun">
                                        <div>
                                            <h6 class="mb-0 fw-bold">Áo Thun Cotton Oversize UTE</h6>
                                            <small class="text-muted">Size: L | Màu: Đen</small>
                                        </div>
                                    </div>
                                </td>
                                <td class="fw-semibold">189.000đ</td>
                                <td>
                                    <div class="input-group input-group-sm" style="width: 100px;">
                                        <button class="btn btn-outline-secondary" type="button">-</button>
                                        <input type="text" class="form-control text-center" value="1">
                                        <button class="btn btn-outline-secondary" type="button">+</button>
                                    </div>
                                </td>
                                <td class="text-danger fw-bold">189.000đ</td>
                                <td>
                                    <button class="btn btn-link text-danger p-0" title="Xóa"><i class="bi bi-trash"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3">
                    <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Tiếp tục mua hàng
                    </a>
                    <button class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-trash me-1"></i>Xóa toàn bộ giỏ
                    </button>
                </div>
            </div>
        </div>

        <!-- Order Summary & Checkout -->
        <div class="col-lg-4">
            <div class="bg-white p-4 rounded-3 shadow-sm border">
                <h5 class="fw-bold mb-3">Tóm Tắt Đơn Hàng</h5>

                <div class="d-flex justify-content-between mb-2 small">
                    <span class="text-muted">Tạm tính:</span>
                    <span class="fw-semibold">189.000đ</span>
                </div>
                <div class="d-flex justify-content-between mb-2 small">
                    <span class="text-muted">Phí vận chuyển:</span>
                    <span class="text-success fw-semibold">Miễn phí</span>
                </div>
                <div class="d-flex justify-content-between mb-3 small">
                    <span class="text-muted">Giảm giá voucher:</span>
                    <span class="text-danger fw-semibold">-0đ</span>
                </div>

                <hr>

                <!-- Voucher Input -->
                <div class="input-group mb-3">
                    <input type="text" class="form-control form-control-sm" placeholder="Nhập mã UTE2026">
                    <button class="btn btn-outline-primary btn-sm" type="button">Áp dụng</button>
                </div>

                <div class="d-flex justify-content-between align-items-baseline mb-4">
                    <span class="fw-bold">Tổng thanh toán:</span>
                    <span class="fs-4 fw-bold text-danger">189.000đ</span>
                </div>

                <a th:href="@{/checkout}" class="btn btn-primary w-100 fw-semibold py-2">
                    Tiến Hành Đặt Hàng <i class="bi bi-arrow-right ms-1"></i>
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
